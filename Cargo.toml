[package]
name = "tcnet"
version = "0.1.1"
edition = "2024"
authors = ["Julius Schmitt dev@jsch.in"]
description = "Rust implementation of the TCNet protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bratorange/tcnet"
documentation = "https://docs.rs/tcnet"
homepage = "https://github.com/bratorange/tcnet"
readme = "README.md"
keywords = ["VJ", "Syncronization", "DJ"]
# Keep the spec PDFs (and the architecture design doc) out of the
# crates.io tarball — they're for the GitHub source tree only.
exclude = ["docs/spec/*", "ARCHITECTURE.md"]

[lib]
name = "tcnet"
path = "src/lib.rs"

[[example]]
name = "observer"
path = "examples/observer.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bitflags = "2.11.0"
deku = "0.20.3"
tokio = { version = "1.49.0", features = ["time", "net", "sync", "rt-multi-thread", "tracing", "macros"] }
log = "0.4.29"
env_logger = "0.11.9"
clap = { version = "4.5.60", features = ["derive"] }
getifs = "0.6.0"
kanal = "0.1.1"
triple_buffer = "9.0.0"
serde = { version = "1", features = ["derive"] }
arc-swap = "1.9.1"

[dev-dependencies]
serial_test = "3"
