[package]
name = "tcnet-rs"
version = "0.1.0"
edition = "2024"
authors = ["Julius Schmitt dev@jsch.in"]

[lib]
name = "tcnet"
path = "src/lib.rs"

[[bin]]
name = "tcnet_test_node"
path = "src/main.rs"

[[bin]]
name = "simulator"
path = "src/bin/simulator.rs"
required-features = ["simulator"]

[[bin]]
name = "luchs"
path = "src/bin/luchs.rs"
required-features = ["luchs"]

[features]
simulator = ["dep:eframe", "dep:egui", "dep:rodio", "dep:lofty", "dep:egui-mcp-client", "dep:egui-mcp-protocol", "dep:image", "egui/accesskit", "dep:accesskit", "dep:serde", "dep:serde_json"]
luchs = ["dep:eframe", "dep:egui", "dep:egui-mcp-client", "dep:egui-mcp-protocol", "dep:image", "egui/accesskit", "dep:accesskit", "dep:sha2", "dep:dirs", "dep:serde", "dep:serde_json", "dep:rosc"]
mcp = ["dep:rmcp", "dep:serde_json"]

[[bin]]
name = "mcp_viewer"
path = "src/bin/mcp_viewer.rs"
required-features = ["mcp"]

[dependencies]
bitflags = "2.11.0"
deku = "0.20.3"
tokio = { version = "1.49.0", features = ["time", "net", "sync", "rt-multi-thread", "tracing", "macros"] }
log = "0.4.29"
env_logger = "0.11.9"
clap = { version = "4.5.60", features = ["derive"] }
getifs = "0.4.0"
kanal = "0.1.1"
triple_buffer = "9"
eframe = { version = "0.33", optional = true, features = ["wgpu"] }
egui = { version = "0.33", optional = true }
accesskit = { version = "0.21", optional = true }
egui-mcp-protocol = { version = "0.0.5", optional = true }
egui-mcp-client = { version = "0.0.5", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rodio = { version = "0.20", optional = true, features = ["symphonia-all"] }
lofty = { version = "0.22", optional = true }
rmcp = { version = "1", features = ["server", "transport-io"], optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
dirs = { version = "5", optional = true }
rosc = { version = "0.10", optional = true }

[dev-dependencies]
serial_test = "3"

[patch.crates-io]
egui-mcp-protocol = { path = "local_crates/egui-mcp-protocol" }
egui-mcp-client   = { path = "local_crates/egui-mcp-client"   }
egui-mcp-server   = { path = "local_crates/egui-mcp-server"   }
