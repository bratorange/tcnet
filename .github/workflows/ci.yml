name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests bind fixed UDP ports (60000-60002, 65023). They serialise via
      # serial_test, but force --test-threads=1 as a belt-and-braces guard.
      - run: cargo test --all-targets -- --test-threads=1